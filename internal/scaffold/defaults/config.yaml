# watchtower repo configuration. All fields optional; shown values are defaults.
# Relative paths resolve against the repo root.
flows: .watchtower/flows
packages: .watchtower/packages
runner: codex         # codex|claude|fake
slots: 4              # concurrent heavy slots
budget: 0             # per-issue token budget (0=off)
price_per_mtok: 0     # estimated $/Mtok (0=hide cost)
codex_bin: codex
codex_model: gpt-5.6-luna
codex_effort: xhigh
claude_bin: claude
test_cmd: ""          # required when any flow uses merge_barrier, e.g. "scripts/verify"
plan_review:
  policy_id: manual-default
  policy_version: "1"
  auto_approve_regular: false
pull: true            # fast-forward the default branch from origin before an issue starts
push: false           # push the default branch to origin after a merge lands
