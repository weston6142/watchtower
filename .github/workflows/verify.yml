name: Verify

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
          cache: true
      - run: go build -o "$RUNNER_TEMP/watchtower" ./cmd/watchtower
      - run: WATCHTOWER_INSTALLED_BIN="$RUNNER_TEMP/watchtower" scripts/verify

  matrix:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
          cache: true
      - run: go build -o "$RUNNER_TEMP/watchtower" ./cmd/watchtower
      - run: WATCHTOWER_INSTALLED_BIN="$RUNNER_TEMP/watchtower" scripts/verify-matrix
